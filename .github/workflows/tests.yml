name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Audit publishable files
        run: python skills/journal-monitor/scripts/audit_repo.py .
      - name: Run offline tests
        run: python -m unittest discover -v
      - name: Check syntax
        run: python -m py_compile check_journals.py
